name: Run Tests

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Or your current Node version
          cache: 'npm'

      - name: Install Dependencies
        run: 
          npm install
          npm ci

      - name: Run Vitest
        run: npm run test:run